name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: trellis validate
      - run: pytest -q
      - run: trellis build -o dist/system-design.apkg
      - uses: actions/upload-artifact@v4
        with:
          name: system-design-apkg
          path: dist/system-design.apkg

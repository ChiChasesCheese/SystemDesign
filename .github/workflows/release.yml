name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0); created if it doesn't exist"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: trellis --all validate
      - run: trellis --all build
      - name: Build the translated decks beside them
        run: |
          for d in skeleton/*.yaml; do
            domain=$(basename "$d" .yaml)
            # A language only ships when nothing in it looks rewritten;
            # an untranslated domain simply has no zh deck.
            trellis --domain "$domain" build --lang zh \
              -o "dist/$domain.zh.apkg" 2>/dev/null || \
              echo "no zh deck for $domain"
          done
      - name: Create release with decks attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.apkg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Trellis decks $TAG" \
            --generate-notes

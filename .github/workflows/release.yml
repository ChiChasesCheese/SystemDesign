name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: trellis --all validate
      - run: trellis --all build
      - name: Create release with decks attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apkg \
            --repo "$GITHUB_REPOSITORY" \
            --title "Trellis decks $GITHUB_REF_NAME" \
            --generate-notes

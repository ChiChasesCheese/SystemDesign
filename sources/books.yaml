# Registry of books the ingest pipeline may download.
#
# Only books their author or publisher gives away may be fetched —
# `scripts/ingest_book.py` refuses anything whose license is not in its
# FREE_LICENSES set. Commercial books still belong here: registering them
# records the chapter→node digestion plan, and the pipeline's digest stage
# (cards written from understanding, never from the text) works without a
# download. See pipeline/README.md for the full flow.
#
# Fields:
#   id        stable slug; archive lands in sources/archive/<id>/,
#             checkpoint in pipeline/state/book-<id>.json
#   license   free-online | cc-by | cc-by-nc | public-domain | commercial
#   domain    which skeleton the digest stage attaches content to
#   chapters  ordered chapter URLs (free books only)

books:
  - id: ddia-2e
    title: "Designing Data-Intensive Applications, 2nd edition"
    author: "Martin Kleppmann & Chris Riccomini"
    license: commercial            # not freely licensed — never downloaded
    home: https://dataintensive.net/
    domain: system-design
    notes: >
      The backbone of the Distributed Data region of the map. The text is
      commercial, so the pipeline works from the freely published companion
      material instead: the literature references at
      https://github.com/ept/ddia-references, Kleppmann's blog essays
      (several are already readings), and the referenced papers themselves.
      Cards are original writing recalling the concepts, per the digest rules.

  - id: mixu-distsys
    title: "Distributed Systems for Fun and Profit"
    author: "Mikito Takada"
    license: free-online           # published free by the author at book.mixu.net
    home: https://book.mixu.net/distsys/
    domain: system-design
    chapters:
      - https://book.mixu.net/distsys/intro.html
      - https://book.mixu.net/distsys/abstractions.html
      - https://book.mixu.net/distsys/time.html
      - https://book.mixu.net/distsys/replication.html
      - https://book.mixu.net/distsys/eventual.html

  - id: sre-book
    title: "Site Reliability Engineering"
    author: "Google (Beyer, Jones, Petoff, Murphy eds.)"
    license: free-online           # published free by Google at sre.google
    home: https://sre.google/sre-book/table-of-contents/
    domain: system-design
    chapters:
      - https://sre.google/sre-book/service-level-objectives/
      - https://sre.google/sre-book/handling-overload/
      - https://sre.google/sre-book/addressing-cascading-failures/
      - https://sre.google/sre-book/managing-critical-state/
      - https://sre.google/sre-book/data-integrity/
